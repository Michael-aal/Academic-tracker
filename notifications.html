<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("academic-tracker-theme") === "dark" ? "dark" : "light"; } catch (_) { document.documentElement.dataset.theme = "light"; }</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100b1b">
  <meta name="description" content="Your Academic Tracker account notifications and important updates.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="premium-theme.css">
  <link rel="stylesheet" href="global-navigation.css">
  <link rel="stylesheet" href="global-light-mode.css" data-global-light-mode>
  <link rel="stylesheet" href="dark-mode-guard.css" data-dark-mode-guard>
  <link rel="stylesheet" href="theme-page-overrides.css" data-page-theme-overrides>
  <link rel="stylesheet" href="notifications.css">
  <script src="global-theme.js" defer></script>
  <title>Notifications · Academic Tracker</title>
</head>
<body class="notifications-page">
  <main class="notification-shell">
    <header class="notification-page-heading">
      <div><p class="notification-eyebrow">YOUR ACCOUNT</p><h1>Notifications</h1><p>Payment confirmations, account activity and important Study Track updates.</p></div>
      <button id="mark-all-read" class="notification-secondary-button" type="button">Mark all as read</button>
    </header>
    <section id="notification-admin" class="notification-admin-card" hidden aria-labelledby="admin-notification-title">
      <div><p class="notification-eyebrow">ADMINISTRATOR TOOLS</p><h2 id="admin-notification-title">Send an announcement</h2><p>Publish an in-app message to every student account or a selected account.</p></div>
      <form id="notification-compose-form">
        <label>Title<input id="announcement-title" maxlength="120" minlength="3" required placeholder="e.g. New study tools are available"></label>
        <label>Message<textarea id="announcement-body" maxlength="4000" minlength="3" rows="4" required placeholder="Write a clear update for students…"></textarea></label>
        <div class="notification-compose-row">
          <label>Type<select id="announcement-category"><option value="ANNOUNCEMENT">Announcement</option><option value="UPDATE">Product update</option><option value="MAINTENANCE">Maintenance notice</option></select></label>
          <label>Audience<select id="announcement-audience"><option value="ALL">All student accounts</option></select></label>
        </div>
        <p id="announcement-status" role="status" class="notification-form-status"></p>
        <button class="notification-primary-button" type="submit" id="send-announcement">Publish notification</button>
      </form>
    </section>
    <div class="notification-list-toolbar"><span id="notification-count">Loading notifications…</span><button id="refresh-notifications" type="button">Refresh</button></div>
    <section id="notification-list" class="notification-list" aria-live="polite" aria-busy="true">
      <div class="notification-loading">Loading your notifications…</div>
    </section>
  </main>
  <script src="notifications.js"></script>
  <script src="global-navigation.js"></script>
</body>
</html>

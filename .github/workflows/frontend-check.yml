name: Academic Tracker frontend checks

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - ".github/workflows/frontend-check.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - ".github/workflows/frontend-check.yml"
  workflow_dispatch:

jobs:
  frontend-static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check browser JavaScript
        run: |
          set -eu
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check theme-controller coverage and local HTML references
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const pages = fs.readdirSync(".").filter(file => file.endsWith(".html"));
          const errors = [];
          for (const page of pages) {
            const html = fs.readFileSync(page, "utf8");
            const count = (html.match(/data-global-theme/g) || []).length;
            if (count !== 1 || !/<head>[\s\S]*?<script src="global-theme\.js" data-global-theme defer><\/script>[\s\S]*?<\/head>/.test(html)) {
              errors.push(`${page}: expected exactly one shared theme controller in the document head (found ${count})`);
            }
            const refs = [...html.matchAll(/(?:href|src)=["']([^"']+)["']/g)].map(match => match[1]);
            for (const ref of refs) {
              if (!ref || /^(?:https?:|mailto:|tel:|data:|javascript:|#|\/\/)/i.test(ref)) continue;
              const pathname = decodeURIComponent(ref.split(/[?#]/, 1)[0]);
              if (!pathname) continue;
              const localPath = path.resolve(".", pathname.startsWith("/") ? pathname.slice(1) : pathname);
              if (!fs.existsSync(localPath)) errors.push(`${page}: missing local reference ${ref}`);
            }
          }
          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          console.log(`Checked ${pages.length} HTML pages: theme controller and local references passed.`);
          NODE

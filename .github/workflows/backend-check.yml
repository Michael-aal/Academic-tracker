  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_tracker?schema=public
      JWT_SECRET: test-only-secret-that-is-longer-than-thirty-two-characters
      RUN_DB_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academic_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academic_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: node --check src/routes/user-data.js && node --check src/routes/account.js && node --check src/middleware/auth.js && node --check src/routes/auth.js && node --check ../auth.js && node --check src/routes/premium.js && node --check src/routes/notifications.js && node --check src/routes/learning.js && node --check src/learning-content.js && node --check src/routes/ai.js && node --check src/ai-quota.js && node --check src/app.js && node --check src/routes/university.js && npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to a clean PostgreSQL database
        run: npx prisma migrate deploy
      - name: Run unit and database integration tests
        run: npm test
      - name: Verify local frontend asset references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path("..").resolve()
          missing = []

          class AssetParser(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("src") if tag == "script" else attrs.get("href") if tag == "link" else None
                  if not value:
                      return
                  parsed = urlsplit(value)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      return
                  target = (root / parsed.path.lstrip("/")).resolve()
                  if not target.is_file():
                      missing.append(f"{self.page}: {value}")

          for page in root.glob("*.html"):
              parser = AssetParser(page.name)
              parser.feed(page.read_text(encoding="utf-8"))

          if missing:
              print("Missing local frontend assets:")
              print("\n".join(missing))
              raise SystemExit(1)
          print("All local script and link assets referenced by root HTML pages exist.")
          PY
      - name: Check calculator and AI learning JavaScript syntax
        run: node --check ../calculator-engine.js && node --check ../calculator.js && node --check ../app.js && node --check ../ai-learning.js && node --check ../quiz-page.js && node --check ../ai-navigation.js && node --check ../educational-videos.js && node --check ../study-planner.js && node --check ../memory-mastery.js && node --check ../notes-summary.js && node --check ../global-theme.js && node --check ../global-navigation.js && node --check ../premium-page.js && node --check ../notifications.js && node --check ../english-studio.js && node --check ../level-up.js && node --check ../exam-simulator.js && node --check ../sw.js && node --check ../focus-music.js && node --check ../notes-workspace.js && node --check ../universal-notes.js && node --check ../account-data.js && node --check ../profile.js

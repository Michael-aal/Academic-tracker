name: Academic Tracker backend checks

on:
  push:
    branches: [main, feature/backend-prisma]
    paths:
      - "backend/**"
      - "calculator-engine.js"
      - "calculator.js"
      - "ai-learning.js"
      - "quiz-page.js"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "calculator-engine.js"
      - "calculator.js"
      - "ai-learning.js"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_tracker?schema=public
      JWT_SECRET: test-only-secret-that-is-longer-than-thirty-two-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit tests
        run: npm test
      - name: Check calculator and AI learning JavaScript syntax
        run: node --check ../calculator-engine.js && node --check ../calculator.js && node --check ../ai-learning.js && node --check ../quiz-page.js

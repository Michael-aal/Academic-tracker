<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a17">
  <meta name="description" content="A personal academic accountability tracker that works offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Academic Tracker</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-view="dashboard"><span class="brand-mark">A</span><span>Academic<span class="muted"> Tracker</span></span></a>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-link active" data-view="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav-link" data-view="scores">▤ <span>Score entry</span></button>
        <button class="nav-link" data-view="subjects">◈ <span>Subjects</span></button>
        <button class="nav-link" data-view="reports">▥ <span>Reports</span></button>
        <button class="nav-link" data-view="settings">⚙ <span>Backup & settings</span></button>
      </nav>
      <div class="sidebar-note"><span class="status-dot"></span> Your data stays on this device</div>
    </aside>
    <main class="main">
      <header class="topbar"><div><p class="eyebrow">YOUR PERSONAL STUDY SPACE</p><h1 id="page-title">Dashboard</h1></div><div class="top-actions"><span class="local-pill"><span class="status-dot"></span> Offline-ready</span><button class="icon-button" id="quick-add" aria-label="Add subject" title="Add subject">＋</button></div></header>
      <div id="app" aria-live="polite"></div>
      <footer>Small, consistent progress adds up. <span id="year-label"></span></footer>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="active" data-view="dashboard"><span>▦</span>Home</button>
    <button data-view="scores"><span>▤</span>Scores</button>
    <button data-view="subjects"><span>◈</span>Subjects</button>
    <button data-view="reports"><span>▥</span>Reports</button>
    <button data-view="settings"><span>⚙</span>More</button>
  </nav>
  <dialog id="subject-dialog">
    <form method="dialog" id="subject-form">
      <div class="dialog-head"><div><p class="eyebrow">BUILD YOUR TRACKER</p><h2>Add a subject</h2></div><button class="icon-button" type="button" id="close-subject-dialog" aria-label="Close">×</button></div>
      <label>Subject name<input id="subject-name" required maxlength="70" placeholder="e.g. Mathematics"></label>
      <label>Target total (out of 100)<input id="subject-target" type="number" min="0" max="100" value="75" required></label>
      <div class="dialog-actions"><button class="button secondary" type="button" id="cancel-subject">Cancel</button><button class="button primary" id="save-subject" value="default">Add subject</button></div>
    </form>
  </dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
